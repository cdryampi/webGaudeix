{% load i18n %}

<!-- Mobile menu button - Optimizado y Minimalista -->
<button id="mobile-menu-button"
        type="button"
        class="inline-flex items-center justify-center p-2 w-10 h-10 text-white dark:text-gray-200 rounded-lg lg:hidden hover:bg-white/20 dark:hover:bg-gray-800/70 focus:outline-none focus:ring-2 focus:ring-white/50 dark:focus:ring-gray-700 transition-all duration-200"
        aria-controls="mobile-menu-overlay"
        aria-expanded="false"
        aria-label="{% trans 'Obrir menú' %}">
    <span class="sr-only">{% trans "Obrir menú" %}</span>
    <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
    </svg>
</button>
